<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honors &amp; Trials — VII Legion Imperial Fists</title>
<meta name="description" content="Every honor, ordeal and rank trial of the VII Legion Imperial Fists in one place.">
<style>
  :root {
    --page: #2A1F0E;
    --parchment: #F5F0E8;
    --parchment-dark: #EDE5D0;
    --gold: #C9A84C;
    --gold-light: #E8D5A3;
    --gold-text: #6E5210;
    --ink: #1A1410;
    --ink-muted: #4A3F30;
    --line: #C9A84C66;
    --focus: #1A4A7A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--page);
    color: var(--ink);
    font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
    line-height: 1.6;
    min-height: 100vh;
  }

  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .skip {
    position: absolute; left: 1rem; top: -4rem;
    background: var(--parchment); color: var(--ink);
    padding: 0.5rem 1rem; border: 2px solid var(--focus); z-index: 10;
  }
  .skip:focus { top: 1rem; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .outer { max-width: 860px; margin: 0 auto; padding: 2rem 1rem 3rem; }

  .sheet { background: var(--parchment); border-radius: 4px; }

  header.sheet {
    text-align: center;
    padding: 2.25rem 2rem 1.75rem;
    border-bottom: 1px solid var(--gold);
    border-radius: 4px 4px 0 0;
  }

  .chapter-mark {
    font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--gold-text); margin-bottom: 0.6rem;
  }

  h1 { font-size: 2rem; font-weight: 400; letter-spacing: 0.05em; line-height: 1.2; }

  .sub { color: var(--ink-muted); font-style: italic; margin-top: 0.25rem; }

  main.sheet { padding: 2rem 2.5rem 2.5rem; border-radius: 0 0 4px 4px; }

  a { color: var(--focus); }

  .section-title {
    font-size: 0.85rem; font-weight: 400; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--ink-muted); margin-bottom: 0.6rem;
  }

  .path ol {
    list-style: none; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
    margin-bottom: 2rem;
  }
  .path li { display: flex; align-items: center; gap: 0.4rem; }
  .path li + li::before { content: "→"; color: var(--gold-text); }
  .path a, .path span.step {
    display: inline-block; padding: 0.3rem 0.75rem; border: 1px solid var(--gold);
    border-radius: 3px; text-decoration: none; color: var(--ink); background: var(--parchment-dark);
  }
  .path span.step { color: var(--ink-muted); font-style: italic; background: transparent; }
  .path a:hover { background: var(--gold-light); }

  .controls {
    display: grid; grid-template-columns: 1fr auto; gap: 1rem 1.5rem; align-items: end;
    padding: 1rem; background: var(--parchment-dark); border: 1px solid var(--line);
    border-radius: 3px; margin-bottom: 1rem;
  }
  .controls label, .controls legend { display: block; font-size: 0.9rem; color: var(--ink-muted); margin-bottom: 0.3rem; }
  .controls fieldset { border: none; }

  input[type="search"], select {
    width: 100%; font: inherit; font-size: 1rem; padding: 0.5rem 0.65rem;
    border: 1px solid var(--ink-muted); border-radius: 3px; background: #FFFDF8; color: var(--ink);
  }

  .seg { display: flex; border: 1px solid var(--gold-text); border-radius: 3px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 0.95rem; padding: 0.45rem 0.9rem; min-height: 44px;
    border: none; background: transparent; color: var(--gold-text); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--gold-text); }
  .seg button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
  .seg button:not([aria-pressed="true"]):hover { background: var(--gold-light); }

  .branch-row { grid-column: 1 / -1; max-width: 18rem; }

  #count { font-size: 0.95rem; color: var(--ink-muted); margin-bottom: 1rem; }

  .card { border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 3px; margin-bottom: 0.75rem; background: #FBF8F1; }
  .card.ordeal { border-left-color: #7A4A00; }
  .card:target { box-shadow: 0 0 0 3px var(--gold); }

  .card h2 { font-size: 1.2rem; font-weight: 400; margin: 0; }
  .card h2 button {
    width: 100%; display: flex; align-items: center; gap: 0.75rem; text-align: left;
    font: inherit; color: var(--ink); background: none; border: none; cursor: pointer;
    padding: 0.85rem 1rem; min-height: 44px; letter-spacing: 0.03em;
  }
  .card h2 button:hover { background: var(--parchment-dark); }
  .chev { flex-shrink: 0; width: 0.9rem; transition: transform 0.15s; color: var(--gold-text); }
  .card h2 button[aria-expanded="true"] .chev { transform: rotate(90deg); }

  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0 1rem 0.85rem 2.65rem; margin-top: -0.35rem; }
  .tag { font-size: 0.8rem; padding: 0.1rem 0.55rem; border-radius: 2px; border: 1px solid; }
  .tag-trial { background: #E8F0F8; color: #1A4A7A; border-color: #1A4A7A66; }
  .tag-ordeal { background: #F8F0E0; color: #6B4100; border-color: #6B410066; }
  .tag-branch { background: #F0EAF8; color: #4A1A7A; border-color: #4A1A7A66; }
  .tag-eq { background: transparent; color: var(--ink-muted); border-color: var(--line); }

  .panel { padding: 0 1rem 1rem 2.65rem; }
  .panel[hidden] { display: none; }
  .motto { font-style: italic; color: var(--ink-muted); margin-bottom: 0.5rem; }
  .summary { margin-bottom: 0.75rem; }
  .pending { font-style: italic; color: var(--ink-muted); margin-bottom: 0.75rem; }
  .panel h3 {
    font-size: 0.85rem; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-muted); margin: 1rem 0 0.3rem;
  }
  .panel ul { padding-left: 1.25rem; }
  .panel li { margin-bottom: 0.2rem; }
  .source { font-size: 0.85rem; color: var(--ink-muted); margin-top: 1rem; }

  .empty { padding: 1.5rem; text-align: center; color: var(--ink-muted); font-style: italic; }

  footer {
    text-align: center; padding: 1.5rem 1rem 0; font-size: 0.8rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-light);
  }
  footer a { color: var(--gold-light); }

  @media (max-width: 600px) {
    header.sheet { padding: 1.5rem 1rem 1.25rem; }
    h1 { font-size: 1.6rem; }
    main.sheet { padding: 1.25rem 1rem 1.5rem; }
    .controls { grid-template-columns: 1fr; }
    .tags, .panel { padding-left: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<a class="skip" href="#results">Skip to honors list</a>

<div class="outer">
  <header class="sheet">
    <p class="chapter-mark">Imperial Fists · VII Legion</p>
    <h1>Honors &amp; Trials</h1>
    <p class="sub">Every honor, ordeal and rank trial of the Chapter in one place</p>
  </header>

  <main class="sheet" id="main">
    <nav class="path" aria-labelledby="path-title">
      <h2 class="section-title" id="path-title">Librarium progression path</h2>
      <ol id="path"></ol>
    </nav>

    <section class="controls" aria-label="Search and filter">
      <div>
        <label for="q">Search honors and trials</label>
        <input type="search" id="q" autocomplete="off" placeholder="e.g. Tyranid, Battle Saga, Codicier">
      </div>
      <fieldset>
        <legend>Show</legend>
        <div class="seg" id="type-filter">
          <button type="button" data-type="all" aria-pressed="true">All</button>
          <button type="button" data-type="trial" aria-pressed="false">Rank trials</button>
          <button type="button" data-type="ordeal" aria-pressed="false">Ordeals</button>
        </div>
      </fieldset>
      <div class="branch-row">
        <label for="branch">Branch</label>
        <select id="branch"><option value="all">All branches</option></select>
      </div>
    </section>

    <p id="count" role="status" aria-live="polite"></p>
    <div id="results" tabindex="-1"></div>
  </main>

  <footer>
    <p>Source: <a href="librarium_codex.html">Codex Librarium</a> · Last updated <span id="updated"></span></p>
    <p>Ad tuam gloriam et gloriam Illius in Terra</p>
  </footer>
</div>

<script src="honors-data.js"></script>
<script>
(function () {
  const { HONORS, BRANCHES, updated } = window.CODEX_DATA;
  const byId = Object.fromEntries(HONORS.map(h => [h.id, h]));
  const branchName = Object.fromEntries(BRANCHES.map(b => [b.id, b.name]));
  const TYPE_LABEL = { trial: "Rank trial", ordeal: "Ordeal" };

  const acceptedFor = {};
  for (const h of HONORS) {
    for (const g of h.requirements) {
      for (const item of g.items) {
        if (typeof item === "object" && item.anyOf) {
          for (const ref of item.anyOf) (acceptedFor[ref] ||= []).push(h.id);
        }
      }
    }
  }

  const state = { q: "", type: "all", branch: "all" };
  const expanded = new Set();

  const qInput = document.getElementById("q");
  const typeButtons = document.querySelectorAll("#type-filter button");
  const branchSelect = document.getElementById("branch");
  const results = document.getElementById("results");
  const count = document.getElementById("count");

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else node.setAttribute(k, v);
    }
    for (const c of children) if (c != null) node.append(c);
    return node;
  }

  function link(id) {
    const target = byId[id];
    return el("a", { href: "#" + id, text: target ? target.name : id });
  }

  function joinOr(ids) {
    const frag = document.createDocumentFragment();
    ids.forEach((id, i) => {
      if (i > 0) frag.append(i === ids.length - 1 ? " or " : ", ");
      frag.append(link(id));
    });
    return frag;
  }

  function itemText(item) {
    if (typeof item === "string") return item;
    return "Complete one of: " + item.anyOf.map(id => byId[id] ? byId[id].name : id).join(" or ");
  }

  function searchableText(h) {
    const parts = [h.name, h.summary, h.motto, h.equivalent, TYPE_LABEL[h.type], branchName[h.branch]];
    for (const g of h.requirements) {
      parts.push(g.group);
      for (const item of g.items) parts.push(itemText(item));
    }
    for (const id of acceptedFor[h.id] || []) parts.push(byId[id].name);
    return parts.filter(Boolean).join(" ").toLowerCase();
  }
  const haystack = Object.fromEntries(HONORS.map(h => [h.id, searchableText(h)]));

  function renderCard(h) {
    const panelId = "panel-" + h.id;
    const open = expanded.has(h.id);

    const button = el("button", { type: "button", "aria-expanded": String(open), "aria-controls": panelId },
      el("span", { class: "chev", "aria-hidden": "true", text: "▸" }),
      el("span", { text: h.name })
    );
    button.addEventListener("click", () => {
      const nowOpen = button.getAttribute("aria-expanded") !== "true";
      button.setAttribute("aria-expanded", String(nowOpen));
      panel.hidden = !nowOpen;
      nowOpen ? expanded.add(h.id) : expanded.delete(h.id);
    });

    const tags = el("div", { class: "tags" },
      el("span", { class: "tag tag-" + h.type, text: TYPE_LABEL[h.type] }),
      el("span", { class: "tag tag-branch", text: branchName[h.branch] || h.branch }),
      h.equivalent ? el("span", { class: "tag tag-eq", text: h.equivalent }) : null
    );

    const panel = el("div", { class: "panel", id: panelId });
    panel.hidden = !open;
    if (h.motto) panel.append(el("p", { class: "motto", text: "“" + h.motto + "”" }));
    panel.append(h.summary
      ? el("p", { class: "summary", text: h.summary })
      : el("p", { class: "pending", text: "Full details for this entry haven't been added to the Codex yet." }));

    for (const g of h.requirements) {
      panel.append(el("h3", { text: g.group }));
      const ul = el("ul");
      for (const item of g.items) {
        ul.append(typeof item === "string"
          ? el("li", { text: item })
          : el("li", {}, "Complete one of: ", joinOr(item.anyOf)));
      }
      panel.append(ul);
    }

    const usedBy = acceptedFor[h.id];
    if (usedBy) {
      panel.append(el("h3", { text: "Accepted for" }));
      const ul = el("ul");
      for (const id of usedBy) ul.append(el("li", {}, link(id), " rank trial"));
      panel.append(ul);
    }

    if (h.source) panel.append(el("p", { class: "source", text: "Source: " + h.source }));

    return el("article", { class: "card " + h.type, id: h.id, "aria-labelledby": "title-" + h.id },
      el("h2", { id: "title-" + h.id }, button), tags, panel);
  }

  function sortKey(h) {
    return (h.type === "trial" ? "0" : "1") + String(h.order ?? 999).padStart(4, "0") + h.name;
  }

  function render() {
    const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    const list = HONORS
      .filter(h => state.type === "all" || h.type === state.type)
      .filter(h => state.branch === "all" || h.branch === state.branch)
      .filter(h => terms.every(t => haystack[h.id].includes(t)))
      .sort((a, b) => sortKey(a).localeCompare(sortKey(b)));

    results.replaceChildren(...(list.length
      ? list.map(renderCard)
      : [el("p", { class: "empty", text: "No honors or trials match your search." })]));
    count.textContent = list.length === 1 ? "Showing 1 entry" : `Showing ${list.length} entries`;
  }

  function renderPath() {
    const steps = HONORS.filter(h => h.type === "trial" && h.branch === "librarium")
      .sort((a, b) => a.order - b.order);
    const ol = document.getElementById("path");
    ol.append(el("li", {}, el("span", { class: "step", text: "Battle Brother" })));
    for (const s of steps) ol.append(el("li", {}, link(s.id)));
  }

  function setType(type) {
    state.type = type;
    typeButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.type === type)));
  }

  function openFromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (!byId[id]) return;
    state.q = ""; qInput.value = "";
    setType("all");
    state.branch = "all"; branchSelect.value = "all";
    expanded.add(id);
    render();
    const btn = document.querySelector("#title-" + CSS.escape(id) + " button");
    btn.scrollIntoView({ block: "start" });
    btn.focus({ preventScroll: true });
  }

  for (const b of BRANCHES) branchSelect.append(el("option", { value: b.id, text: b.name }));
  document.getElementById("updated").textContent = updated;

  qInput.addEventListener("input", () => { state.q = qInput.value; render(); });
  typeButtons.forEach(b => b.addEventListener("click", () => { setType(b.dataset.type); render(); }));
  branchSelect.addEventListener("change", () => { state.branch = branchSelect.value; render(); });
  window.addEventListener("hashchange", openFromHash);

  renderPath();
  render();
  openFromHash();
})();
</script>
</body>
</html>
